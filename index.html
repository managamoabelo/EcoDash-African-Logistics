<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDash - African Logistic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud">
        <p>Battery: <span id="battery">100%</span></p>
        <p>Distance: <span id="distance">0m</span></p>
        <p>Score: <span id="score">0</span></p>
        <p>High Score: <span id="highScore">0</span></p>
        <p>Efficiency: <span id="efficiency">0</span> m/%</p>

        <p id="rainStatus"></p>
        <p id="windStatus"></p>
        <p id="loadStatus"></p>
    </div>

    <canvas></canvas>
    
    <script src="script.js"></script>
</body>
</html>
